name: image

on:
  push:
    branches:
      - main
    tags:
      - '*'
  schedule:
    # Weekly, Mondays at 03:00 - rebuilds even with no Dockerfile changes,
    # to pick up current Alpine package versions (apk doesn't pin versions
    # the way kubernetes-toolkit's curl-installed tools do, so a scheduled
    # rebuild is the freshness mechanism here, not a version-bump PR bot).
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to push alongside latest (e.g. 1.0.0). Only needed for a manual re-run/backfill against an already-released tag - a real tag push derives this automatically.'
        required: false
        type: string

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write # to push to ghcr.io with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 as well as amd64: workshop participants on Apple Silicon run
      # local KinD/minikube clusters with arm64 nodes, which cannot pull an
      # amd64-only image list at all.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ghcr.io is the only registry. eu.gcr.io was retired on 2026-12-07
      # because Google billed every anonymous public pull as internet egress.
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          TAGS="ghcr.io/swade1987/debug-toolkit:latest"
          VERSION="${VERSION_INPUT}"
          if [[ -z "${VERSION}" && "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=${VERSION#refs/tags/}
          fi
          if [[ -n "${VERSION}" ]]; then
            TAGS="${TAGS}"$'\n'"ghcr.io/swade1987/debug-toolkit:${VERSION}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # Signed SLSA build provenance, verifiable with "gh attestation verify".
      # push-to-registry is left off: the attestation is already verifiable
      # via GitHub's own attestation store, which matches on the digest.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/swade1987/debug-toolkit
          subject-digest: ${{ steps.push.outputs.digest }}

      # SPDX SBOM for the exact image just pushed (pinned to its digest, not
      # a floating tag), attested alongside the provenance.
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/swade1987/debug-toolkit@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/swade1987/debug-toolkit
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
