name: commit-lint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-lint:
    name: commit-lint
    # Dependabot's own commit messages don't pass commitlint's stricter
    # subject-case rules (its PR titles do - pr-lint still runs for these).
    # Keyed on the PR's actual author, not github.actor: actor is whoever
    # triggered this specific event, so a later human push to a Dependabot
    # branch (a merge, a rebase, "Update branch") would otherwise flip actor
    # away from dependabot[bot] and make this job run for real.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
